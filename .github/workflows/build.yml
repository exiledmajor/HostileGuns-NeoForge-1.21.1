name: Build Mainframe Mods NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload Hostile Guns
        uses: actions/upload-artifact@v4
        with:
          name: HostileGuns-NeoForge-1.21.1
          path: build/libs/*.jar
      - name: Upload Mainframe Progression Bridge
        uses: actions/upload-artifact@v4
        with:
          name: Mainframe-Progression-Bridge-NeoForge-1.21.1
          path: progressionbridge/build/libs/*.jar
      - name: Upload PulseHUD NeoForge
        uses: actions/upload-artifact@v4
        with:
          name: PulseHUD-NeoForge-1.21.1
          path: pulsehudneoforge/build/libs/*.jar
