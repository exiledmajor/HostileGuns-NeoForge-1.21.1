name: Inspect Chromeware Reference

on:
  push:
    paths:
      - .github/workflows/inspect-chromeware.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CFR
        run: curl -L --fail -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
      - name: Download Chromeware
        run: curl -L --fail -o chromeware-1.1.1.jar https://raw.githubusercontent.com/exiledmajor/Reference/main/chromeware-1.1.1.jar
      - name: Decompile
        run: |
          mkdir -p /tmp/chromeware-decompiled
          java -jar cfr.jar chromeware-1.1.1.jar --outputdir /tmp/chromeware-decompiled --silent true
      - name: Copy relevant source
        run: |
          mkdir -p reference/chromeware-1.1.1
          cp -R /tmp/chromeware-decompiled/* reference/chromeware-1.1.1/
      - name: Commit inspection source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chromeware-1.1.1
          git commit -m "Reference: decompile Chromeware 1.1.1" || exit 0
          git push
